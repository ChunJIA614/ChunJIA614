<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" fill="none" role="img" aria-label="Chun Jia — Software Developer">
  <defs>
    <pattern id="grid-minor" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" stroke="#e6edf3" stroke-opacity="0.025" stroke-width="1" />
    </pattern>
    <pattern id="grid-major" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M 100 0 L 0 0 0 100" stroke="#e6edf3" stroke-opacity="0.05" stroke-width="1" />
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b0f14" stop-opacity="0" />
      <stop offset="0.55" stop-color="#0b0f14" stop-opacity="0.35" />
      <stop offset="1" stop-color="#0b0f14" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 160) scale(380 220)">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.10" />
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
    <clipPath id="clip"><rect width="1200" height="320" rx="12" /></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="320" fill="#0b0f14" />
    <rect width="1200" height="320" fill="url(#grid-minor)" />
    <rect width="1200" height="320" fill="url(#grid-major)" />
    <rect width="1200" height="320" fill="url(#glow)" />
    <rect width="1200" height="320" fill="url(#fade)" />
    <rect x="0" y="0" width="1200" height="3" fill="#58a6ff" fill-opacity="0.85" />
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="11.5" stroke="#21262d" />

  <!-- corner marks -->
  <g stroke="#58a6ff" stroke-opacity="0.6" stroke-width="1.5">
    <path d="M 24 40 V 24 H 40" />
    <path d="M 1160 24 H 1176 V 40" />
    <path d="M 24 280 V 296 H 40" />
    <path d="M 1160 296 H 1176 V 280" />
  </g>

  <!-- header label -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" letter-spacing="1.6">
    <text x="64" y="66" fill="#58a6ff">// SOFTWARE DEVELOPER</text>
    <text x="254" y="66" fill="#484f58">—</text>
    <text x="276" y="66" fill="#7d8590">TARUMT · MALAYSIA</text>
  </g>

  <!-- name -->
  <text x="62" y="128" fill="#f0f6fc" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" letter-spacing="-1.8">Chun Jia</text>

  <!-- tagline -->
  <text x="64" y="166" fill="#8b949e" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400">Building production-minded web platforms, APIs, vision models and automation tools.</text>

  <!-- spec row -->
  <line x1="64" y1="206" x2="704" y2="206" stroke="#21262d" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#58a6ff">
    <text x="64" y="234">01 / WEB</text>
    <text x="224" y="234">02 / BACKEND</text>
    <text x="384" y="234">03 / AI</text>
    <text x="544" y="234">04 / AUTOMATION</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#c9d1d9">
    <text x="64" y="258">React · TypeScript</text>
    <text x="224" y="258">ASP.NET Core · EF</text>
    <text x="384" y="258">PyTorch · RT-DETR</text>
    <text x="544" y="258">Playwright · OCR</text>
  </g>
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7681">
    <text x="64" y="278">PWA · Capacitor</text>
    <text x="224" y="278">SQLite · Firebase</text>
    <text x="384" y="278">Computer Vision</text>
    <text x="544" y="278">PDF · Excel pipelines</text>
  </g>
  <g stroke="#21262d">
    <line x1="208" y1="220" x2="208" y2="284" />
    <line x1="368" y1="220" x2="368" y2="284" />
    <line x1="528" y1="220" x2="528" y2="284" />
  </g>

  <!-- terminal -->
  <rect x="744" y="48" width="400" height="224" rx="8" fill="#0d1117" stroke="#30363d" />
  <path d="M 744 56 a 8 8 0 0 1 8 -8 H 1136 a 8 8 0 0 1 8 8 V 80 H 744 Z" fill="#161b22" />
  <line x1="744" y1="80" x2="1144" y2="80" stroke="#30363d" />
  <circle cx="764" cy="64" r="5" fill="#30363d" />
  <circle cx="782" cy="64" r="5" fill="#30363d" />
  <circle cx="800" cy="64" r="5" fill="#30363d" />
  <text x="944" y="68" text-anchor="middle" fill="#7d8590" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">chunjia@dev: ~</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
    <text x="764" y="108"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> whoami</tspan></text>
    <text x="764" y="128" fill="#8b949e">chun-jia · software developer @ TARUMT</text>
    <text x="764" y="156"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> ls ~/projects --featured</tspan></text>
    <text x="764" y="176" fill="#58a6ff" xml:space="preserve">parkjom/  dormmate/  slot-api/  zapfan/</text>
    <text x="764" y="204"><tspan fill="#3fb950">$</tspan><tspan fill="#e6edf3"> uptime</tspan></text>
    <text x="764" y="224" fill="#8b949e">shipping code on GitHub since 2023</text>
    <text x="764" y="252"><tspan fill="#3fb950">$</tspan></text>
  </g>
  <rect x="778" y="241" width="8" height="15" fill="#e6edf3">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" calcMode="discrete" repeatCount="indefinite" />
  </rect>
</svg>
