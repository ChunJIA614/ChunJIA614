    <rect width="1200" height="300" fill="url(#dot-grid-l)" />
    <rect width="1200" height="300" fill="url(#glow-blue-l)" />
    <rect width="1200" height="300" fill="url(#glow-indigo-l)" />
    <rect width="1200" height="300" fill="url(#glow-emerald-l)" />

    <path d="M -20 270 Q 320 215 650 285 T 1220 235" stroke="#0284c7" stroke-opacity="0.14" stroke-width="1.5" fill="none" />
    <path d="M -20 288 Q 360 245 710 296 T 1220 258" stroke="#0d9488" stroke-opacity="0.11" stroke-width="1" fill="none" />
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="17.25" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Top status badge -->
  <rect x="56" y="44" width="272" height="30" rx="15" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <circle cx="75" cy="59" r="7" fill="#1a7f37" fill-opacity="0.2">
    <animate attributeName="r" values="4.5;8.5;4.5" dur="2.6s" repeatCount="indefinite" />
    <animate attributeName="fill-opacity" values="0.32;0.05;0.32" dur="2.6s" repeatCount="indefinite" />
  </circle>
  <circle cx="75" cy="59" r="4" fill="#1a7f37" />
  <text x="89" y="63.5" fill="#334155" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="0.3">TARUMT · Software Development</text>

  <!-- Main Title -->
  <text x="56" y="136" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="-1">
    <tspan fill="#0f172a">Hi, I'm </tspan><tspan fill="url(#name-accent-l)" font-weight="800">Chun Jia</tspan>
  </text>

  <!-- Subtitle -->
  <text x="56" y="175" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500">
    <tspan fill="#0969da" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="15.5" font-weight="600">@ChunJIA614</tspan><tspan fill="#94a3b8">  ·  </tspan><tspan fill="#475569">Building full-stack web apps, APIs, CV &amp; automation</tspan>
  </text>

  <!-- Focus pills -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    <rect x="56" y="210" width="136" height="34" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="75" cy="227" r="4" fill="#0284c7" />
    <text x="87" y="231.5" fill="#1e293b">Web &amp; PWAs</text>

    <rect x="204" y="210" width="144" height="34" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="223" cy="227" r="4" fill="#7c3aed" />
    <text x="235" y="231.5" fill="#1e293b">Backend APIs</text>

    <rect x="360" y="210" width="126" height="34" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="379" cy="227" r="4" fill="#059669" />
    <text x="391" y="231.5" fill="#1e293b">AI &amp; Vision</text>

    <rect x="498" y="210" width="136" height="34" rx="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="517" cy="227" r="4" fill="#d97706" />
    <text x="529" y="231.5" fill="#1e293b">Automation</text>
  </g>

  <!-- Right Code Card -->
  <rect x="728" y="38" width="416" height="224" rx="14" fill="#ffffff" fill-opacity="0.96" stroke="#cbd5e1" stroke-width="1.25" />
  <line x1="728" y1="74" x2="1144" y2="74" stroke="#e2e8f0" stroke-width="1" />

  <!-- Window controls -->
  <circle cx="750" cy="56" r="5" fill="#ff5f56" />
  <circle cx="768" cy="56" r="5" fill="#ffbd2e" />
  <circle cx="786" cy="56" r="5" fill="#27c93f" />
  <text x="1124" y="60" text-anchor="end" fill="#64748b" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500">chunjia.profile.ts</text>

  <!-- Code snippet -->
  <g font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="12.5">
    <text x="748" y="102"><tspan fill="#7c3aed">const</tspan><tspan fill="#0f172a"> developer = </tspan><tspan fill="#64748b">{</tspan></text>
    <text x="764" y="125"><tspan fill="#0369a1">name</tspan><tspan fill="#64748b">: </tspan><tspan fill="#15803d">"Chun Jia"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="764" y="148"><tspan fill="#0369a1">base</tspan><tspan fill="#64748b">: </tspan><tspan fill="#15803d">"Malaysia · TARUMT"</tspan><tspan fill="#64748b">,</tspan></text>
    <text x="764" y="171"><tspan fill="#0369a1">stack</tspan><tspan fill="#64748b">: [</tspan><tspan fill="#b45309">"React"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#b45309">"TS"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#b45309">"C#"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#b45309">"Python"</tspan><tspan fill="#64748b">],</tspan></text>
    <text x="764" y="194"><tspan fill="#0369a1">focus</tspan><tspan fill="#64748b">: [</tspan><tspan fill="#b45309">"PWA"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#b45309">"APIs"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#b45309">"CV"</tspan><tspan fill="#64748b">, </tspan><tspan fill="#b45309">"OCR"</tspan><tspan fill="#64748b">],</tspan></text>
    <text x="764" y="217"><tspan fill="#0369a1">motto</tspan><tspan fill="#64748b">: </tspan><tspan fill="#15803d">"ship practical software"</tspan></text>
    <text x="748" y="240"><tspan fill="#64748b">};</tspan></text>
