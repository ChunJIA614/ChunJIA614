<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" fill="none" role="img" aria-label="Chun Jia (@ChunJIA614) - Software Development Banner">
  <defs>
    <linearGradient id="bg-light" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="55%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#eff6ff" />
    </linearGradient>

    <radialGradient id="glow-blue-l" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 55) rotate(25) scale(440 240)">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-emerald-l" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1020 260) rotate(-15) scale(420 240)">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-indigo-l" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(680 140) scale(360 220)">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="name-accent-l" x1="210" y1="90" x2="520" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0969da" />
      <stop offset="55%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>

    <pattern id="dot-grid-l" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.15" fill="#64748b" fill-opacity="0.18" />
    </pattern>

    <clipPath id="card-clip-l">
      <rect x="0" y="0" width="1200" height="300" rx="18" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip-l)">
